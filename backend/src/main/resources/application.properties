# Server Configuration
spring.application.name=globetrotter-backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL via Env Vars with H2 Fallback for Zero-Config Dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:globetrotter_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:${DB_DRIVER:org.h2.Driver}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Environment Variable with 256-bit Secret Fallback)
jwt.secret=${JWT_SECRET:default_secret_key_that_is_at_least_32_bytes_long!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3003}

# Brevo Transactional Email Configuration
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:GlobeTrotter}
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:3003}

# Actuator / Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
